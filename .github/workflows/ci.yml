name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard-checks:
    name: standard-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check committed whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          comparison_base=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
              ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
              echo "Pull request base commit is unavailable." >&2
              exit 1
            fi
            comparison_base="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]] &&
            [[ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if [[ ! "$PUSH_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
              ! git cat-file -e "${PUSH_BASE_SHA}^{commit}" 2>/dev/null; then
              echo "Push base commit is unavailable; refusing an incomplete whitespace check." >&2
              exit 1
            fi
            comparison_base="$PUSH_BASE_SHA"
          else
            comparison_base="$(git merge-base origin/main HEAD)"
          fi
          if [[ "$comparison_base" != "$(git rev-parse HEAD)" ]]; then
            git diff --check "$comparison_base" HEAD --
          else
            git diff-tree --check --root -m HEAD
          fi
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run standard checks
        run: make check

  browser-checks:
    name: browser-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      TARTEEL_BROWSER_CHANNEL: chromium
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install locked browser dependencies
        run: npm ci --prefix tests/browser
      - name: Install pinned Playwright Chromium
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      # The QA server uses only loopback listeners and synthetic in-memory data.
      - name: Run browser checks
        env:
          TARTEEL_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/tarteel-house-browser
        run: make check-browser
      - name: Upload browser failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure
          path: ${{ runner.temp }}/tarteel-house-browser
          retention-days: 7
          if-no-files-found: warn
